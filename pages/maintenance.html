    <!-- Grille principale -->

        <div class="eyebrow maintenance__eyebrow">

        </p>

        <a href="../index.html" class="btn btn--primary maintenance__btn">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">

      ──────────────────────────────────────────────── -->

        <!-- Illustration -->
        <div class="maintenance__media">
          <div class="maintenance__media-bg" aria-hidden="true"></div>

            src="../assets/images/placeholder.svg"
            alt="Illustration symbolisant une page en cours de construction"
            class="maintenance__img"
            width="320"
            height="320"
            loading="eager"
            decoding="async"

        </div>
<!-- Carte contact rapide -->

          <ul class="maintenance__contact-list">

              <div class="maintenance__contact-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                  <rect x="2" y="4" width="20" height="16" rx="2"/>
                  <polyline points="2,4 12,13 22,4"/>
                </svg>
              </div>
              <a href="mailto:onghollyservices@gmail.com" class="maintenance__contact-link">onghollyservices@gmail.com</a>

            <li class="maintenance__contact-item">
