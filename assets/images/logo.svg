<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Lato Corps — ONG Internationale">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D28A"/>
      <stop offset="45%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#8F6E23"/>
    </linearGradient>
  </defs>

  <!-- Globe -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="url(#gold)" stroke-width="3.5"/>

  <!-- Méridiens -->
  <ellipse cx="60" cy="60" rx="18" ry="46" fill="none" stroke="url(#gold)" stroke-width="2.25"/>
  <ellipse cx="60" cy="60" rx="46" ry="18" fill="none" stroke="url(#gold)" stroke-width="2.25" transform="rotate(90 60 60)"/>

  <!-- Parallèles -->
  <ellipse cx="60" cy="60" rx="46" ry="14" fill="none" stroke="url(#gold)" stroke-width="1.75"/>
  <ellipse cx="60" cy="60" rx="46" ry="30" fill="none" stroke="url(#gold)" stroke-width="1.75"/>

  <!-- Axe -->
  <line x1="60" y1="14" x2="60" y2="106" stroke="url(#gold)" stroke-width="1.75"/>
</svg>
